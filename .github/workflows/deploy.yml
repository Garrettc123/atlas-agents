name: ATLAS Agents - Full Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:

  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install black isort flake8

      - name: Black format check
        run: black --check --diff .

      - name: isort check
        run: isort --check-only --diff .

      - name: Flake8 lint
        run: flake8 . --max-line-length=100 --exclude=.venv,__pycache__,.git

  test:
    name: "Test Suite"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install fastapi uvicorn pytest pytest-asyncio httpx pydantic

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          ENVIRONMENT: test

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install bandit
      - run: bandit -r agents/ main.py -ll

  deploy:
    name: "Deploy to Railway"
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service atlas-agents --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment Success
        run: echo "✅ ATLAS Agents deployed successfully at $(date -u)"
